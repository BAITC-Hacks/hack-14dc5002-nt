name: CI

on:
  push:
    branches: [main, Bakytzhan, Semba, Nikita]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_USE_MOCK_API: "true"
  AI_ENABLED: "false"
  OPENAI_API_KEY: ""
  OPENAI_MODEL: ""

jobs:
  checks:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.11.1"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node verification/check-fixtures.mjs
      - run: npx tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler verification/fixture-literals.ts src/contracts/index.ts
      - run: npm run build

  browser:
    name: Mock demo in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.11.1"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
